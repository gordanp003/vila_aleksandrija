        e.target.tagName, String(e.target.src || e.target.href || ''));

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's

    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down

      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }

    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;

    window.addEventListener('message', function (e) {

      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {

              const { done, value } = await reader.read();

              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');

          return;
        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

0Vila%20Aleksandrija%20slobodna%20od%20___%20do%20___.%20Dolazi%20nas%20___.\" target=\"_blank\" rel=\"noopener\" style=\"flex:1 1 auto;text-align:center;background:#F7F5EF;color:#344D3F;text-decoration:none;padding:17px 24px;border-radius:6px;font-size:15px;font-weight:600\" style-hover=\"background:#E8E2D6;color:#252923\">Proverite slobodne termine<\u002Fa>\n            <a href=\"tel:+381616512035\" style=\"flex:1 1 auto;text-align:center;border:1px solid rgba(247,245,239,0.45);color:#F7F5EF;text-decoration:none;padding:16px 22px;border-radius:6px;font-size:15px;font-weight:500\" style-hover=\"border-color:#F7F5EF;color:#F7F5EF\">Pozovite<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"margin-top:clamp(48px,6vw,80px);height:clamp(340px,52vw,700px);position:relative\">\n        <img data-photo=\"hero-vila-siroka\" data-src=\"./slike/vila-spolja-hd.jpg\" alt=\"Glavna fotografija: vila spolja sa borovima, široki kadar\" fetchpriority=\"high\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ČINJENICE -->\n  <section aria-label=\"Osnovno o vili\" style=\"max-width:1240px;margin:0 auto;padding:clamp(40px,5vw,64px) 24px 0\">\n    <div style=\"display:grid;grid-template-columns:{{ statCols }};gap:1px;background:#E8E2D6;border-top:1px solid #252923;border-bottom:1px solid #E8E2D6\">\n      <div style=\"background:#F7F5EF;padding:28px 20px\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(44px,4.6vw,60px);font-weight:400;line-height:1;color:#344D3F\">220<span style=\"font-size:0.5em\"> m²<\u002Fspan><\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase\">Površina<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F7F5EF;padding:28px 20px\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(44px,4.6vw,60px);font-weight:400;line-height:1;color:#344D3F\">4<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase\">Spavaće sobe<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F7F5EF;padding:28px 20px\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(44px,4.6vw,60px);font-weight:400;line-height:1;color:#344D3F\">6<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase\">Kreveta<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F7F5EF;padding:28px 20px\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(44px,4.6vw,60px);font-weight:400;line-height:1;color:#344D3F\">2<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase\">Kupatila<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#F7F5EF;padding:28px 20px;grid-column:{{ statLast }};text-align:{{ statLastAlign }}\">\n        <div style=\"font-family:'Cormorant Garamond',serif;font-size:clamp(44px,4.6vw,60px);font-weight:400;line-height:1;color:#344D3F\">2<\u002Fdiv>\n        <div style=\"margin-top:10px;font-size:12px;font-weight:600;letter-spacing:0.16em;text-transform:uppercase\">Terase<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- UVOD -->\n  <section aria-label=\"O vili\" style=\"max-width:1240px;margin:0 auto;padding:clamp(80px,11vw,144px) 24px\">\n    <p style=\"margin:0 auto;max-width:17em;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(32px,4.2vw,56px);line-height:1.18;color:#252923;text-wrap:balance\">Ujutru kafa na terasi. Popodne ručak za drvenim stolom. Uveče đakuzi, a oko vas samo borovi.<\u002Fp>\n    <div style=\"margin:40px auto 0;width:1px;height:64px;background:#344D3F\"><\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SMEŠTAJ -->\n  <section id=\"smestaj\" data-screen-label=\"Smeštaj\" style=\"max-width:1240px;margin:0 auto;padding:0 24px clamp(80px,11vw,144px)\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 64px;padding-bottom:28px;border-bottom:1px solid #252923\">\n      <div style=\"display:flex;align-items:baseline;gap:20px\">\n        <span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:#344D3F\">01<\u002Fspan>\n        <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(40px,5vw,68px);line-height:1\">Smeštaj<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0;max-width:30em;font-size:17px;line-height:1.7;text-wrap:pretty\">Dnevni boravak i kuhinja su mesto gde se svi okupljaju. Četiri spavaće sobe daju svakome da se povuče kad poželi.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(48px,6vw,80px);display:flex;flex-wrap:wrap;gap:32px clamp(32px,5vw,72px);align-items:center\">\n      <div style=\"flex:1.4 1 460px;min-width:0;height:clamp(300px,38vw,520px);position:relative\">\n        <img data-photo=\"smestaj-boravak\" data-src=\"./slike/boravak-trpezarija.jpg\" alt=\"Dnevni boravak\" loading=\"lazy\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px\">\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0\">\n        <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,3vw,40px);line-height:1.08\">Boravak, kuhinja i trpezarija<\u002Fh3>\n        <p style=\"margin:18px 0 0;font-size:16px;line-height:1.7;text-wrap:pretty\">Boravak je prostran, sa dovoljno mesta da cela ekipa sedne zajedno. Kuhinja je potpuno opremljena, pa kuvate kao kod kuće i ručate svi za jednim stolom.<\u002Fp>\n        <ul style=\"list-style:none;margin:24px 0 0;padding:0;font-size:15px;border-top:1px solid #E8E2D6\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #E8E2D6\">Prostran dnevni boravak sa televizorom<\u002Fli>\n          <li style=\"padding:12px 0;border-bottom:1px solid #E8E2D6\">Potpuno opremljena kuhinja<\u002Fli>\n          <li style=\"padding:12px 0;border-bottom:1px solid #E8E2D6\">Trpezarija za celo društvo<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(56px,7vw,96px);display:flex;flex-wrap:wrap-reverse;gap:32px clamp(32px,5vw,72px);align-items:center\">\n      <div style=\"flex:1 1 320px;min-width:0\">\n        <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,3vw,40px);line-height:1.08\">Četiri spavaće sobe i dva kupatila<\u002Fh3>\n        <p style=\"margin:18px 0 0;font-size:16px;line-height:1.7;text-wrap:pretty\">Ukupno 6 kreveta. Javite nam koliko vas dolazi i reći ćemo vam kako da se rasporedite. Sa dva kupatila jutro prolazi bez čekanja ispred vrata.<\u002Fp>\n        <ul style=\"list-style:none;margin:24px 0 0;padding:0;font-size:15px;border-top:1px solid #E8E2D6\">\n          <li style=\"padding:12px 0;border-bottom:1px solid #E8E2D6\">4 spavaće sobe, 6 kreveta<\u002Fli>\n          <li style=\"padding:12px 0;border-bottom:1px solid #E8E2D6\">2 kupatila<\u002Fli>\n          <li style=\"padding:12px 0;border-bottom:1px solid #E8E2D6\">Klima-uređaj i besplatan Wi-Fi<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"flex:1.4 1 460px;min-width:0;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;height:clamp(300px,38vw,520px)\">\n        <div style=\"position:relative\">\n          <img data-photo=\"smestaj-soba\" data-src=\"./slike/soba-terasa.jpg\" alt=\"Spavaća soba\" loading=\"lazy\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px\">\n        <\u002Fdiv>\n        <div style=\"position:relative\">\n          <img data-photo=\"smestaj-kupatilo\" data-src=\"./slike/kupatilo.jpg\" alt=\"Kupatilo\" loading=\"lazy\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px\">\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:clamp(56px,7vw,96px);display:flex;flex-wrap:wrap;gap:32px clamp(32px,5vw,72px);align-items:center\">\n      <div style=\"flex:1.4 1 460px;min-width:0;height:clamp(300px,38vw,520px);position:relative\">\n        <img data-photo=\"smestaj-terasa\" data-src=\"./slike/terasa-pogled.jpg\" alt=\"Terasa sa pogledom na borove\" loading=\"lazy\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px\">\n      <\u002Fdiv>\n      <div style=\"flex:1 1 320px;min-width:0\">\n        <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(30px,3vw,40px);line-height:1.08\">Dve terase<\u002Fh3>\n        <p style=\"margin:18px 0 0;font-size:16px;line-height:1.7;text-wrap:pretty\">Jedna za prvu jutarnju kafu, druga za veče uz pogled na prirodu. Kad je društvo veliko, svako nađe svoje mesto napolju.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- DVORIŠTE -->\n  <section id=\"dvoriste\" data-screen-label=\"Dvorište\" style=\"background:#252923;color:#F7F5EF\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:clamp(80px,11vw,144px) 24px\">\n      <div style=\"display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 64px;padding-bottom:28px;border-bottom:1px solid rgba(247,245,239,0.3)\">\n        <div style=\"display:flex;align-items:baseline;gap:20px\">\n          <span style=\"font-family:'Cormorant Garamond',serif;font-size:22px;font-style:italic;color:#E8E2D6\">02<\u002Fspan>\n          <h2 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(40px,5vw,68px);line-height:1\">Dvorište<\u002Fh2>\n        <\u002Fdiv>\n        <p style=\"margin:0;max-width:30em;font-size:17px;line-height:1.7;color:#E8E2D6;text-wrap:pretty\">Oko kuće su borovi, a dvorište je samo vaše. Deca trče slobodno, a vi sedite napolju koliko god želite.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:clamp(48px,6vw,72px);display:grid;grid-template-columns:{{ yardCols }};gap:{{ yardGap }}\">\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"aspect-ratio:3/4;position:relative\">\n            <img data-photo=\"dvoriste-djakuzi\" data-src=\"./slike/djakuzi.jpg\" alt=\"Hidromasažna kada (đakuzi)\" loading=\"lazy\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px\">\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(247,245,239,0.3);padding-top:20px\">\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:clamp(22px,2.4vw,28px);font-weight:500;line-height:1.1\">Hidromasažna kada<\u002Fh3>\n            <p style=\"margin:12px 0 0;font-size:15px;line-height:1.7;color:#E8E2D6\">Đakuzi je napolju, na drvenoj platformi u dvorištu. Za kraj dana, posle duge šetnje.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:22px\">\n          <div style=\"aspect-ratio:3/4;position:relative\">\n            <img data-photo=\"dvoriste-sto\" data-src=\"./slike/sto-natkriven.jpg\" alt=\"Natkriven prostor sa drvenim stolom\" loading=\"lazy\" decoding=\"async\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;border-radius:8px\">\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid rgba(247,245,239,0.3);padding-top:20px\">\n            <h3 style=\"margin:0;font-family:'Cormorant Garamond',serif;font-size:clamp(22px,2.4vw,28px);font-weight:500;line-heigh nimations ?? true) === false) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const header = document.querySelector('header');\n    const root = header && header.parentElement;\n    if (!root) return;\n    const ease = 'cubic-bezier(.22,.61,.24,1)';\n    const T = (el, props) => { el.style.transition = props; };\n\n    // Header se blago sabije posle skrola\n    const row = header.firstElementChild;\n    T(row, 'padding .45s ' + ease);\n    this.onScroll = () => { const v = window.scrollY > 40 ? '3px' : '8px'; row.style.paddingTop = v; row.style.paddingBottom = v; };\n    window.addEventListener('scroll', this.onScroll, { passive: true });\n    root.querySelectorAll('a, button').forEach(a => T(a, 'background-color .3s ease, color .3s ease, border-color .3s ease'));\n\n    const hidden = (el, y) => { el.style.opacity = '0'; el.style.transform = 'translateY(' + y + 'px)'; };\n    const shown = (el) => { el.style.opacity = '1'; el.style.transform = 'none'; };\n\n    // Slike: otkrivaju se odozdo, uz lagano smirivanje zuma\n    const prepImg = (wrap) => {\n      const slot = wrap.querySelector('img[data-photo]');\n      wrap.style.overflow = 'hidden';\n      wrap.style.borderRadius = '8px';\n      wrap.style.clipPath = 'inset(100% 0 0 0 round 8px)';\n      slot.style.transform = 'scale(1.06)';\n      wrap._slot = slot;\n    };\n    const showImg = (wrap, delay) => {\n      T(wrap, 'clip-path 1.3s ' + ease + ' ' + delay + 'ms');\n      T(wrap._slot, 'transform 2.2s ' + ease + ' ' + delay + 'ms');\n      wrap.style.clipPath = 'inset(0 0 0 0 round 8px)';\n      wrap._slot.style.transform = 'scale(1)';\n    };\n\n    // HERO: redosled pri učitavanju\n    const hero = root.querySelector('#pocetak');\n    if (hero) {\n      const seq = [];\n      const eyebrow = hero.querySelector('div > div');\n      const h1 = hero.querySelector('h1');\n      const intro = h1 && h1.nextElementSibling;\n      const heroImg = hero.querySelector('img[data-photo]') && hero.querySelector('img[data-photo]').parentElement;\n      const line = eyebrow && eyebrow.children[1];\n      [eyebrow, h1, intro].forEach(el => el && hidden(el, el === h1 ? 36 : 16));\n      if (line) { line.style.transform = 'scaleX(0)'; line.style.transformOrigin = 'left'; }\n      if (heroImg) prepImg(heroImg);\n      requestAnimationFrame(() => requestAnimationFrame(() => {\n        [[eyebrow, 0, .8], [h1, 120, 1.2], [intro, 420, 1]].forEach(([el, d, dur]) => {\n          if (!el) return;\n          T(el, 'opacity ' + dur + 's ' + ease + ' ' + d + 'ms, transform ' + dur + 's ' + ease + ' ' + d + 'ms');\n          shown(el);\n        });\n        if (line) { T(line, 'transform 1s ' + ease + ' 300ms'); line.style.transform = 'scaleX(1)'; }\n        if (heroImg) showImg(heroImg, 600);\n      }));\n    }\n\n    const targets = [];\n    const mark = (el, kind) => { if (el && !el._rv && !hero.contains(el)) { el._rv = kind; targets.push(el); } };\n\n    root.querySelectorAll('section img[data-photo]').forEach(slot => { const w = slot.parentElement; if (!hero.contains(w)) { prepImg(w); mark(w, 'img'); } });\n    root.querySelectorAll('section h2, section h3, section p, section li, footer p').forEach(el => mark(el, 'txt'));\n    root.querySelectorAll('section div, footer div').forEach(d => {\n      if (/gap:\\s*12px/.test(d.getAttribute('style') || '') && d.querySelector(':scope > a')) mark(d, 'txt');\n    });\n    root.querySelectorAll('section span[role=\"img\"]').forEach(el => mark(el, 'logo'));\n    root.querySelectorAll('section[aria-label=\"Osnovno o vili\"] > div > div').forEach(el => mark(el, 'txt'));\n\n    // Linije ispod naslova sekcija se iscrtavaju sleva\n    root.querySelectorAll('section div').forEach(d => {\n      const st = d.getAttribute('style') || '';\n      if (!/padding-bottom:\\s*28px/.test(st) || !/border-bottom:\\s*1px/.test(st)) return;\n      const color = getComputedStyle(d).borderBottomColor;\n      d.style.position = 'relative';\n      d.style.borderBottomColor = 'transparent';\n      const ln = document.createElement('div');\n      Object.assign(ln.style, { position: 'absolute', left: '0', right: '0', bottom: '-1px', height: '1px', background: color, transform: 'scaleX(0)', transformOrigin: 'left' });\n      d.appendChild(ln);\n      ln._rv = 'line'; targets.push(ln);\n    });\n    // Vertikalna linija u uvodu raste nadole\n    Array.from(root.querySelectorAll('section div')).filter(v => /(^|;)\\s*height:\\s*64px/.test(v.getAttribute('style') || '')).forEach(v => {\n      v.style.transform = 'scaleY(0)'; v.style.transformOrigin = 'top'; v._rv = 'vline'; targets.push(v);\n    });\n\n    targets.forEach(el => {\n      if (el._rv === 'txt') hidden(el, 18);\n      if (el._rv === 'logo') { el.style.opacity = '0'; el.style.transform = 'scale(.94)'; }\n    });\n\n    // Brojevi u traci se izbroje do prave vrednosti\n    const isStat = (d) => /font-size:\\s*clamp\\(44px/.test(d.getAttribute('style') || '');\n    const stats = Array.from(root.querySelectorAll('section[aria-label=\"Osnovno o vili\"] div')).filter(isStat);\n    stats.forEach(st => { const t = st.firstChild; if (t && t.nodeType === 3) { st._to = parseInt(t.textContent, 10); st._node = t; t.textContent = '0'; } });\n    const count = (st, delay) => setTimeout(() => {\n      const t0 = performance.now(), dur = 1300;\n      const step = (now) => { const k = Math.min(1, (now - t0) / dur); st._node.textContent = String(Math.round(st._to * (1 - Math.pow(1 - k, 3)))); if (k < 1) requestAnimationFrame(step); };\n      requestAnimationFrame(step);\n    }, delay);\n\n    const delayFor = (el) => {\n      const sibs = Array.from(el.parentElement.children).filter(c => c._rv && c._rv === el._rv);\n      return Math.min(Math.max(0, sibs.indexOf(el)), 5) * (el.tagName === 'LI' ? 50 : 90);\n    };\n\n    this.io = new IntersectionObserver(entries => {\n      entries.forEach(en => {\n        if (!en.isIntersecting) return;\n        const el = en.target;\n        if (el._imgWraps) { el._imgWraps.forEach(w => showImg(w, delayFor(w))); if (!el._rv) { this.io.unobserve(el); return; } }\n        const d = delayFor(el);\n        if (el._rv === 'img') showImg(el, d);\n        else if (el._rv === 'line') { T(el, 'transform 1.4s ' + ease); el.style.transform = 'scaleX(1)'; }\n        else if (el._rv === 'vline') { T(el, 'transform 1.1s ' + ease + ' 300ms'); el.style.transform = 'scaleY(1)'; }\n        else if (el._rv === 'logo') { T(el, 'opacity 1.2s ' + ease + ', transform 1.6s ' + ease); el.style.opacity = '1'; el.style.transform = 'scale(1)'; }\n        else { T(el, 'opacity .9s ' + ease + ' ' + d + 'ms, transform .9s ' + ease + ' ' + d + 'ms'); shown(el); }\n        const st = el.querySelectorAll && Array.from(el.querySelectorAll('div')).find(isStat);\n        if (st && st._node) count(st, d + 150);\n        this.io.unobserve(el);\n      });\n    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });\n    targets.forEach(el => {\n      if (el._rv === 'img') { const sp = el.parentElement; sp._imgWraps = (sp._imgWraps || []).concat(el); if (!sp._observed) { sp._observed = true; this.io.observe(sp); } }\n      else this.io.observe(el);\n    });\n\n    // Galerija: blag zum na prelaz mišem\n    const gal = root.querySelector('#galerija');\n    if (gal && window.matchMedia('(hover: hover)').matches) {\n      gal.querySelectorAll('img[data-photo]').forEach(slot => {\n        const w = slot.parentElement;\n        w.addEventListener('mouseenter', () => { T(slot, 'transform .9s ' + ease); slot.style.transform = 'scale(1.035)'; });\n        w.addEventListener('mouseleave', () => { T(slot, 'transform .9s ' + ease); slot.style.transform = 'scale(1)'; });\n      });\n    }\n  }\n  renderVals() {\n    const w = this.state.w;\n    const narrow = w < 768;\n    const tablet = w < 1024;\n    return {\n      isMobile: w < 1100,\n      isDesktop: w >= 1100,\n      menuOpen: w < 1100 && this.state.menuOpen,\n      menuLabel: this.state.menuOpen ? 'Zatvori' : 'Meni',\n      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      showBooking: this.props.showBooking ?? true,\n      showSticky: narrow && !this.state.menuOpen && (this.props.stickyCta ?? true),\n      headerPadX: narrow ? '16px' : '24px',\n      brandGap: narrow ? '8px' : '12px',\n      logoBox: narrow ? '44px' : '58px',\n      logoBg: narrow ? '82px' : '106px',\n      brandFs: w < 380 ? '15px' : (narrow ? '17px' : '20px'),\n      brandLs: narrow ? '0.07em' : '0.12em',\n      brandSubFs: narrow ? '9px' : '10px',\n      heroBg: 'linear-gradient(to bottom, #344D3F 0, #344D3F 72%, #F7F5EF 72%)',\n      heroPadB: '0',\n      heroGapTop: narrow ? '22px' : '32px',\n      eyebrowFs: w < 380 ? '10px' : (narrow ? '11px' : '12px'),\n      eyebrowLs: narrow ? '0.2em' : '0.28em',\n      eyebrowGap: narrow ? '10px' : '16px',\n      eyebrowLine: narrow ? '24px' : '40px',\n      statCols: narrow ? 'repeat(2, minmax(0, 1fr))' : 'repeat(5, minmax(0, 1fr))',\n      statLast: narrow ? 'span 2' : 'auto',\n      statLastAlign: narrow ? 'center' : 'left',\n      yardGap: narrow ? '36px 12px' : '48px 20px',\n      galleryCols: tablet ? 'repeat(2, minmax(0, 1fr))' : 'repeat(4, minmax(0, 1fr))',\n      yardCols: narrow ? 'repeat(2, minmax(0, 1fr))' : (tablet ? 'repeat(2, minmax(0, 1fr))' : 'repeat(4, minmax(0, 1fr))'),\n      yardRows: narrow ? '340px 240px 240px' : 'clamp(220px,22vw,300px) clamp(220px,22vw,300px)',\n      yardBigRow: narrow ? 'auto' : 'span 2'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
